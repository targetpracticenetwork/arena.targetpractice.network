apiVersion: apps/v1
kind: Deployment
metadata:
  name: arenaservice
  namespace: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arenaservice
  template:
    metadata:
      labels:
        app: arenaservice
    spec:
      containers:
        - name: arenaservice
          image: docker.io/library/alpine:latest
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - -c
            - |
              apk add --no-cache wireguard-tools iptables iproute2 bash
              ip link add dev wg0 type wireguard
              /opt/arenaservice/arenaservice-static
          ports:
            - containerPort: 443
              name: grpc
              protocol: TCP
            - containerPort: 11820
              name: wireguard
              protocol: UDP
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: arenaservice-binary
              mountPath: /opt/arenaservice
            - name: wg-config
              mountPath: /etc/wireguard
      volumes:
        - name: arenaservice-binary
          hostPath:
            path: /home/topman/arena.targetpractice.network/bin
            type: Directory
        - name: wg-config
          emptyDir: {} 