apiVersion: apps/v1
kind: Deployment
metadata:
  name: arenaservice
  namespace: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arenaservice
  template:
    metadata:
      labels:
        app: arenaservice
    spec:
      serviceAccountName: arenaservice
      initContainers:
        - name: wireguard-setup
          image: docker.io/library/alpine:latest
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "🔧 Init: Setting up WireGuard interface as root..."
              # Install required packages
              apk add --no-cache wireguard-tools iptables iproute2
              
              # Set up WireGuard environment
              export WIREGUARD_INTERFACE=wg0
              export WIREGUARD_ADDRESS=10.0.0.1/24
              export WIREGUARD_PORT=11820
              
              # Generate WireGuard keys
              echo "🔑 Init: Generating WireGuard keys..."
              WIREGUARD_PRIVATE_KEY=$(wg genkey)
              WIREGUARD_PUBLIC_KEY=$(echo "$WIREGUARD_PRIVATE_KEY" | wg pubkey)
              echo "✅ Generated public key: $WIREGUARD_PUBLIC_KEY"
              
              # Enable IP forwarding
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv6.conf.all.forwarding=1
              
              # Create WireGuard configuration
              mkdir -p /etc/wireguard
              cat > /etc/wireguard/$WIREGUARD_INTERFACE.conf << EOF
              [Interface]
              PrivateKey = $WIREGUARD_PRIVATE_KEY
              ListenPort = $WIREGUARD_PORT
              EOF
              chmod 600 /etc/wireguard/$WIREGUARD_INTERFACE.conf
              
              # Create and configure the WireGuard interface
              echo "🔧 Init: Creating WireGuard interface..."
              ip link add dev $WIREGUARD_INTERFACE type wireguard
              wg setconf $WIREGUARD_INTERFACE /etc/wireguard/$WIREGUARD_INTERFACE.conf
              ip addr add $WIREGUARD_ADDRESS dev $WIREGUARD_INTERFACE
              ip link set dev $WIREGUARD_INTERFACE up
              
              # Set up iptables rules for NAT
              echo "🔧 Init: Setting up NAT rules..."
              iptables -A FORWARD -i $WIREGUARD_INTERFACE -j ACCEPT
              iptables -A FORWARD -o $WIREGUARD_INTERFACE -j ACCEPT
              iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
              
              echo "✅ Init: WireGuard setup completed"
              wg show $WIREGUARD_INTERFACE
          securityContext:
            privileged: true
          volumeMounts:
            - name: wg-config
              mountPath: /etc/wireguard
      containers:
        - name: arenaservice
          image: docker.io/library/alpine:latest
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "🚀 Starting ArenaService as non-root user..."
              
              echo "🔍 Verifying WireGuard interface exists..."
              ip link show wg0 || echo "⚠️ WireGuard interface not found, but continuing..."
              
              echo "🚀 Starting ArenaService..."
              exec /opt/arenaservice/arenaservice-static
          ports:
            - containerPort: 443
              name: grpc
              protocol: TCP
            - containerPort: 11820
              name: wireguard
              protocol: UDP
          env:
            - name: ARENA_INSECURE_DISABLE_MTLS
              value: "true"
            - name: WIREGUARD_INTERFACE
              value: "wg0"
            - name: WIREGUARD_ADDRESS
              value: "10.0.0.1/24"
            - name: WIREGUARD_PORT
              value: "11820"
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
              drop: ["ALL"]
          volumeMounts:
            - name: arenaservice-binary
              mountPath: /opt/arenaservice
            - name: wg-config
              mountPath: /etc/wireguard
      volumes:
        - name: arenaservice-binary
          hostPath:
            path: /home/topman/arena.targetpractice.network/bin
            type: Directory
        - name: wg-config
          emptyDir: {} 