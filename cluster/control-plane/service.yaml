apiVersion: v1
kind: Service
metadata:
  name: arenaservice
  namespace: control-plane
spec:
  type: LoadBalancer # Use NodePort for local/dev if needed
  selector:
    app: arenaservice
  ports:
    - name: grpc
      port: 443
      targetPort: 443
      protocol: TCP
    - name: wireguard
      port: 11820
      targetPort: 11820
      protocol: UDP 