apiVersion: v1
kind: Secret
metadata:
  name: api-repoflow-secret
type: kubernetes.io/dockerconfigjson
data:
  # .dockerconfigjson contains base64 encoded Docker registry credentials
  # To recreate this secret, run:
  # kubectl create secret docker-registry api-repoflow-secret \
  #   --docker-server=api.repoflow.io \
  #   --docker-username=hello@joncooperworks \
  #   --docker-password=$(cat password.key) \
  #   --dry-run=client -o yaml > cluster/secrets/api-repoflow-secret.yaml
  .dockerconfigjson: <base64-encoded-docker-config> 