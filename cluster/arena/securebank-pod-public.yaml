apiVersion: v1
kind: Pod
metadata:
  name: securebank
  namespace: arena-192-168-100-4
  labels:
    app: securebank
    tier: frontend
spec:
  containers:
  - name: securebank
    image: nginx:alpine
    ports:
    - containerPort: 80
      protocol: TCP
    envFrom:
    - configMapRef:
        name: app-config
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  restartPolicy: Always 